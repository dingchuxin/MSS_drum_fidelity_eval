# Model registry — VERIFIED roster (availability checked 2026-07).
#
# `runner`:
#   builtin  -> runs in the main .venv, in-process (src/mss_eval/separate.py).
#   sidecar  -> runs in a separate venv (dependency conflicts force isolation); the CLI
#               produces stems that are ingested. See docs/environments.md.
#
# The roster spans architecture families and eras:
#   spleeter    2019  freq-domain CNN (U-Net, soft masks)        reference baseline
#   htdemucs    2022  hybrid (CNN + cross-domain transformer)   reference baseline
#   bs_roformer 2023  band-split transformer (masking)          current SOTA (attention)
#   scnet       2024  sparse-compression CNN encoder/decoder with a dual-path BiLSTM
#                     separation network (direct output)        current SOTA (no attention)
# BS-Roformer and SCNet-XL share training data (MUSDB18HQ only) and have similar published
# drums SDR, but differ in much more than attention (recurrence vs attention, masking vs
# direct output, STFT, parameter count, chunk overlap), so the pair does NOT isolate an
# architectural factor.

models:
  htdemucs:
    runner: builtin
    engine: audio_separator        # main .venv; audio-separator wraps Demucs v4
    model: "htdemucs.yaml"         # verified 4-stem: drums/bass/vocals/other
    domain: hybrid
    stems: [drums, bass, vocals, other]
    version: "4.0"
    notes: "Hybrid Transformer Demucs. audio-separator 0.44.2 defaults: shifts=2 with UNSEEDED random offsets (output not reproducible run to run), overlap 0.25, whole-input mean/std normalisation, and a 0.9 output peak cap applied per stem when writing (fired on 7 cached v1 stems). Phase 2 re-runs (B1) seed the shifts and bypass the peak cap."
    deterministic: false           # unseeded random shifts at the audio-separator defaults

  spleeter:
    runner: sidecar
    venv: .venv-spleeter           # numpy<2 + TF 2.12; conflicts with audio-separator
    config: "spleeter:4stems"      # spleeter CLI -p flag
    domain: spectrogram
    stems: [vocals, drums, bass, other]
    version: "2.4.2"
    notes: "2019 freq-domain baseline. Verified import."

  bs_roformer:
    runner: sidecar
    venv: .venv-msst               # ZFTurbo MSST inference
    model_type: bs_roformer
    config: external/MSST/configs/config_bs_roformer_384_8_2_485100.yaml   # 4-stem; matches model_bs_roformer_ep_17_sdr_9.6568 (MSST v1.0.12)
    checkpoint: data/weights/bs_roformer_musdb.ckpt                 # download from MSST releases
    ingest_dir: data/stems_out/bs_roformer
    domain: transformer
    stems: [drums, bass, vocals, other]
    version: "BS-Roformer (2023)"
    notes: "Current SOTA, attention. MUSDB drums ~11.6 dB. Uses CUDA when available."

  scnet:
    runner: sidecar
    venv: .venv-msst
    model_type: scnet
    config: external/MSST/configs/config_musdb18_scnet_xl.yaml   # 4-stem; matches model_scnet_ep_54_sdr_9.8051 (MSST v1.0.13)
    checkpoint: data/weights/scnet_xl_musdb.ckpt                 # download from MSST releases
    ingest_dir: data/stems_out/scnet
    domain: cnn+bilstm             # dual-path BiLSTM separation network, no attention
    stems: [drums, bass, vocals, other]
    version: "SCNet-XL (2024)"
    notes: "Current SOTA without attention: CNN encoder/decoder plus 8 dual-path BiLSTM layers (full-chunk recurrent context along time), direct complex-spectrogram output. MUSDB ~9.8 dB avg (drums 11.51 vs bs_roformer 11.61, MUSDB test). Similar published quality to bs_roformer, but not an architecture-isolating pair (see header)."

defaults:
  sample_rate: 44100
  deterministic: true      # fixed params, no random re-init -- holds for the
                           # MSST models and Spleeter up to GPU fp16 non-determinism; NOT for
                           # htdemucs at audio-separator defaults (see its entry)
